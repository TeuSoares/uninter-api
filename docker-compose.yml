version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: baozistore-mysql
    restart: always
    environment:
      MYSQL_DATABASE: baozistore
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
